<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Future Systems Interface</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #020617;
    color: #e2e8f0;
}

/* HEADER */
header {
    text-align: center;
    padding: 15px;
    border-bottom: 1px solid #1e293b;
    letter-spacing: 2px;
}

/* GRID BACKGROUND */
#display {
    width: 700px;
    height: 350px;
    margin: 20px auto;
    position: relative;
    background: radial-gradient(circle, #020617, black);
    overflow: hidden;
}

/* animated grid */
#display::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(#0ea5e9 1px, transparent 1px),
                      linear-gradient(90deg, #0ea5e9 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.1;
    animation: moveGrid 10s linear infinite;
}

@keyframes moveGrid {
    from {background-position: 0 0;}
    to {background-position: 40px 40px;}
}

/* MENU */
#menu {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    padding: 10px 14px;
    border: 1px solid #38bdf8;
    background: transparent;
    color: #38bdf8;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #38bdf8;
    color: black;
}

/* LOG PANEL */
#log {
    width: 700px;
    margin: auto;
    background: #020617;
    border: 1px solid #1e293b;
    padding: 10px;
    height: 120px;
    overflow-y: auto;
    font-size: 13px;
    color: #94a3b8;
}

/* TEXT */
#info {
    width: 700px;
    margin: 10px auto;
    font-size: 14px;
    color: #cbd5f5;
}
</style>
</head>

<body>

<header> AI INTEGRATED NANOTECH & ROBOTICS SYSTEM </header>

<div id="menu">
    <button onclick="medicine()">Medicine</button>
    <button onclick="communication()">Communication</button>
    <button onclick="transport()">Transport</button>
    <button onclick="agriculture()">Agriculture</button>
    <button onclick="economy()">Economy</button>
</div>

<div id="display"></div>

<div id="info">System ready. Awaiting command...</div>
<div id="log">> Boot sequence complete...</div>

<script>
const display = document.getElementById("display");
const log = document.getElementById("log");
const info = document.getElementById("info");

function writeLog(text) {
    log.innerHTML += "<br>> " + text;
    log.scrollTop = log.scrollHeight;
}

function clearDisplay() {
    display.innerHTML = "";
}

/* MEDICINE */
function medicine() {
    clearDisplay();
    writeLog("Deploying nanomedical units...");
    info.innerText = "Nanobots autonomously detect pathogens and repair damaged cells at a microscopic level.";

    for (let i = 0; i < 3; i++) {
        let bot = document.createElement("div");
        bot.style.width = "8px";
        bot.style.height = "8px";
        bot.style.background = "cyan";
        bot.style.position = "absolute";
        bot.style.borderRadius = "50%";
        bot.style.top = Math.random()*300 + "px";
        bot.style.left = "0px";
        bot.style.boxShadow = "0 0 8px cyan";

        display.appendChild(bot);

        setInterval(() => {
            bot.style.left = Math.random()*700 + "px";
            bot.style.top = Math.random()*350 + "px";
        }, 1000);
    }
}

/* COMMUNICATION */
function communication() {
    clearDisplay();
    writeLog("Initializing quantum data network...");
    info.innerText = "Nanotech enables ultra-fast, near-instant communication systems across global networks.";

    for (let i = 0; i < 20; i++) {
        let dot = document.createElement("div");
        dot.style.width = "4px";
        dot.style.height = "4px";
        dot.style.background = "lime";
        dot.style.position = "absolute";
        dot.style.top = Math.random()*350 + "px";
        dot.style.left = Math.random()*700 + "px";

        display.appendChild(dot);

        setInterval(() => {
            dot.style.left = Math.random()*700 + "px";
            dot.style.top = Math.random()*350 + "px";
        }, 1500);
    }
}

/* TRANSPORT */
function transport() {
    clearDisplay();
    writeLog("Activating autonomous transport system...");
    info.innerText = "Robotic systems eliminate human error, enabling safe and efficient autonomous transportation.";

    let car = document.createElement("div");
    car.style.width = "40px";
    car.style.height = "20px";
    car.style.background = "white";
    car.style.position = "absolute";
    car.style.top = "150px";
    car.style.left = "0px";

    display.appendChild(car);

    setInterval(() => {
        car.style.left = Math.random()*650 + "px";
    }, 1000);
}

/* AGRICULTURE */
function agriculture() {
    clearDisplay();
    writeLog("Enhancing crop systems...");
    info.innerText = "Nanotechnology improves plant growth while robots monitor environmental conditions.";

    for (let i = 0; i < 5; i++) {
        let plant = document.createElement("div");
        plant.style.width = "6px";
        plant.style.height = "10px";
        plant.style.background = "green";
        plant.style.position = "absolute";
        plant.style.bottom = "0px";
        plant.style.left = i * 120 + "px";

        display.appendChild(plant);

        setTimeout(() => {
            plant.style.height = "80px";
        }, 500);
    }
}

/* ECONOMY */
function economy() {
    clearDisplay();
    writeLog("Analyzing economic impact...");
    info.innerText = "Automation increases productivity but requires workforce adaptation to new technological demands.";

    for (let i = 0; i < 6; i++) {
        let bar = document.createElement("div");
        bar.style.width = "30px";
        bar.style.height = "10px";
        bar.style.background = "gold";
        bar.style.position = "absolute";
        bar.style.bottom = "0px";
        bar.style.left = i * 60 + "px";

        display.appendChild(bar);

        setTimeout(() => {
            bar.style.height = (Math.random()*150) + "px";
        }, 300);
    }
}
</script>

</body>
</html>
